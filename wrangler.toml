name = "vaultkey"
main = "worker.js"
compatibility_date = "2026-09-25"

[assets]
directory = "./public"
binding = "ASSETS"

# R2バケットとの紐付け。ダッシュボードの
# Settings > Bindings からR2 bucketを追加しても同じ設定になる。
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "vaultkey-bucket"

# VAULT_TOKEN はここには書かない。
# ダッシュボードの Settings > Variables and Secrets で Secret として追加するか、
# ローカルなら: wrangler secret put VAULT_TOKEN
