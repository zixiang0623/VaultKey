<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VaultKey — パスワード&TOTP管理</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔐</text></svg>">
<style>
:root{
  --bg:oklch(97% .004 250); --bg2:oklch(100% 0 0); --bg3:oklch(95% .006 250);
  --border:oklch(20% .01 250 / .08); --text:oklch(17% .01 250); --sub:oklch(50% .01 250);
  --accent:oklch(58% .15 150); --accent-ink:oklch(99% 0 0); --accent-soft:oklch(58% .15 150 / .13);
  --accent2:oklch(68% .16 155); --danger:oklch(58% .21 25); --warn:oklch(72% .15 80);
  --radius:16px; --radius-sm:12px; --pill:999px;
  --mono:'SF Mono',ui-monospace,Menlo,Consolas,monospace;
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
  --shadow:0 1px 2px oklch(0% 0 0 / .04), 0 8px 22px oklch(0% 0 0 / .07);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:oklch(13% .01 250); --bg2:oklch(19% .012 250); --bg3:oklch(24% .014 250);
    --border:oklch(95% .01 250 / .1); --text:oklch(95% .008 250); --sub:oklch(65% .01 250);
    --accent:oklch(70% .16 152); --accent-ink:oklch(12% .02 150); --accent-soft:oklch(70% .16 152 / .18);
    --shadow:0 1px 2px oklch(0% 0 0 / .3), 0 10px 26px oklch(0% 0 0 / .35);
  }
}
:root[data-theme="dark"]{
  --bg:oklch(13% .01 250); --bg2:oklch(19% .012 250); --bg3:oklch(24% .014 250);
  --border:oklch(95% .01 250 / .1); --text:oklch(95% .008 250); --sub:oklch(65% .01 250);
  --accent:oklch(70% .16 152); --accent-ink:oklch(12% .02 150); --accent-soft:oklch(70% .16 152 / .18);
  --shadow:0 1px 2px oklch(0% 0 0 / .3), 0 10px 26px oklch(0% 0 0 / .35);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
@media (prefers-reduced-motion:reduce){*{transition-duration:.001ms!important;animation-duration:.001ms!important}}
body{font-family:var(--font); background:var(--bg); color:var(--text); letter-spacing:-.011em; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); -webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit; color:inherit; font-size:15px}
button{cursor:pointer; border:none; background:none; -webkit-tap-highlight-color:transparent}
button:disabled{opacity:.4; cursor:not-allowed}
input,select,textarea{background:var(--bg3); border:1.5px solid transparent; border-radius:var(--radius-sm); padding:13px 15px; color:var(--text); width:100%; transition:border-color .18s var(--ease), background .15s}
input:hover,select:hover,textarea:hover{border-color:color-mix(in oklch, var(--accent) 35%, transparent)}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:none; background:var(--bg2); border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-soft)}
.btn{min-height:44px; padding:11px 20px; border-radius:var(--pill); font-size:14.5px; font-weight:650; transition:transform .13s var(--ease), filter .15s, background .15s}
.btn:hover{filter:brightness(1.05)}
.btn:active{transform:scale(.95); transition-duration:.06s}
.btn-primary{background:var(--accent); color:var(--accent-ink); box-shadow:0 4px 14px color-mix(in oklch, var(--accent) 45%, transparent)}
.btn-ghost{background:var(--bg3); color:var(--text)}
.btn-ghost:hover{background:color-mix(in oklch, var(--accent) 10%, var(--bg3))}
.btn-danger{background:transparent; color:var(--danger); border:1.5px solid color-mix(in oklch, var(--danger) 35%, transparent)}
.btn-danger:hover{background:color-mix(in oklch, var(--danger) 10%, transparent)}
.btn-icon{width:42px;height:42px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:17px; transition:background .15s, transform .12s var(--ease)}
.btn-icon:hover{background:var(--bg3)}
.btn-icon:active{transform:scale(.9)}
.loading{opacity:.55; pointer-events:none}
.card{background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow)}

#lock{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px}
#lock .card{width:100%; max-width:380px; padding:38px 32px; text-align:center; animation:pop .4s var(--ease)}
@keyframes pop{from{opacity:0; transform:translateY(10px) scale(.97)} to{opacity:1; transform:none}}
#lock .logo{font-size:44px}
#lock h1{font-size:21px; margin:8px 0 2px; letter-spacing:-.03em}
#lock p{color:var(--sub); font-size:13px; margin:0 0 22px}
#lock input{margin-bottom:10px; text-align:center; letter-spacing:.04em}
#lockErr{color:var(--danger); font-size:12.5px; min-height:16px; margin-bottom:6px}

#app{display:none; min-height:100vh; flex-direction:column}
#topbar{display:flex; align-items:center; gap:8px; padding:14px 24px; padding-top:calc(14px + env(safe-area-inset-top,0px)); position:sticky; top:0; z-index:10; background:color-mix(in oklch, var(--bg) 85%, transparent); backdrop-filter:blur(16px); border-bottom:1px solid var(--border)}
#topbar .brand{font-weight:800; font-size:16px; display:flex; align-items:center; gap:6px; color:var(--text); letter-spacing:-.02em; white-space:nowrap}
.spacer{flex:1}
#layout{display:flex; flex:1; min-height:0; overflow:hidden}
#sidebar{width:230px; padding:20px 14px; flex-shrink:0; display:flex; flex-direction:column; gap:3px}
.navitem{display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:var(--radius-sm); font-size:14.5px; font-weight:600; width:100%; text-align:left; transition:background .15s var(--ease), color .15s; color:var(--sub)}
.navitem .nav-ic{font-size:18px}
.navitem:hover{background:var(--bg3); color:var(--text)}
.navitem.active{background:var(--accent-soft); color:var(--accent)}
#main{flex:1; overflow-y:auto; padding:20px 28px 40px}
#searchbar{margin-bottom:16px}
#searchbar input{border-radius:var(--pill); padding:13px 18px}
#tagChips{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px}
.chip{display:inline-flex; align-items:center; padding:7px 14px; border-radius:var(--pill); font-size:12.5px; font-weight:600; border:1.5px solid var(--border); background:var(--bg2); transition:all .15s var(--ease); flex-shrink:0}
.chip:hover{border-color:var(--accent)}
.chip.active{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
#listMeta{display:flex; align-items:center; margin-bottom:12px; gap:10px}
#listMeta strong{font-size:19px; letter-spacing:-.03em}
#listMeta select{width:auto; padding:8px 12px; font-size:12.5px; border-radius:var(--pill)}
#grid{display:flex; flex-direction:column}
.entry{display:flex; align-items:center; gap:13px; padding:14px 16px; margin-bottom:8px; cursor:pointer; background:var(--bg2); border-radius:var(--radius); box-shadow:var(--shadow); transition:transform .15s var(--ease)}
.entry:active{transform:scale(.98)}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;flex-shrink:0;position:relative;overflow:hidden}
.avatar .favicon{position:absolute; inset:0; width:100%; height:100%; object-fit:contain; padding:9px; background:var(--bg2)}
.entrymain{flex:1; min-width:0}
.entry .title{font-weight:650; font-size:15px; word-break:break-word; letter-spacing:-.01em}
.entry .user{color:var(--sub); font-size:12.5px; word-break:break-word; margin-top:1px}
.meta-row{margin-top:6px; display:flex; flex-wrap:wrap; gap:4px}
.tag{font-size:10.5px; font-weight:650; padding:3px 9px; border-radius:var(--pill); background:var(--bg3); color:var(--sub)}
.badge{font-size:10px; padding:3px 8px; border-radius:var(--pill); font-weight:700}
.badge.weak{background:color-mix(in oklch, var(--danger) 15%, transparent); color:var(--danger)}
.badge.dup{background:color-mix(in oklch, var(--warn) 20%, transparent); color:color-mix(in oklch, var(--warn) 60%, black)}
.entryside{display:flex; flex-direction:column; align-items:flex-end; gap:8px; flex-shrink:0}
.totpmini{font-family:var(--mono); font-size:16px; letter-spacing:1.5px; display:flex; align-items:center; gap:7px; font-weight:700; color:var(--accent2)}
.ring{width:18px; height:18px; border-radius:50%; flex-shrink:0; background:conic-gradient(var(--accent2) calc(var(--pct,100)*1%), var(--border) 0)}
.ring.low{background:conic-gradient(var(--danger) calc(var(--pct,100)*1%), var(--border) 0)}
.tsec{font-size:10.5px; color:var(--sub); font-weight:500}
.fav{font-size:16px; opacity:.28; transition:opacity .15s, transform .15s var(--ease)}
.fav.on{opacity:1; color:var(--warn)}
.fav:active{transform:scale(1.3)}
#empty{text-align:center; color:var(--sub); padding:70px 20px; font-size:14px}

.overlay{position:fixed; inset:0; background:oklch(15% .01 260 / .35); backdrop-filter:blur(3px); display:none; align-items:flex-start; justify-content:center; z-index:50; padding:5vh 16px; overflow-y:auto}
.overlay.show{display:flex; animation:fadein .18s var(--ease)}
@keyframes fadein{from{opacity:0} to{opacity:1}}
.modal{width:100%; max-width:460px; padding:26px; margin-bottom:5vh; animation:modalpop .3s var(--ease)}
@keyframes modalpop{from{opacity:0; transform:scale(.95) translateY(8px)} to{opacity:1; transform:none}}
.modal h2{margin:0 0 18px; font-size:18px; letter-spacing:-.02em}
.field{margin-bottom:14px}
.field label{font-size:12px; color:var(--sub); display:block; margin-bottom:7px; font-weight:600}
.pwrow{display:flex; gap:6px}
.pwrow input{font-family:var(--mono)}
.strength{height:4px; border-radius:3px; background:var(--border); margin-top:8px; overflow:hidden}
.strength div{height:100%; transition:width .25s var(--ease), background .25s}
.modalfoot{display:flex; justify-content:space-between; gap:8px; margin-top:20px}
.toast{position:fixed; bottom:calc(24px + env(safe-area-inset-bottom,0px)); left:50%; transform:translateX(-50%) translateY(24px); background:var(--text); color:var(--bg); padding:12px 22px; border-radius:var(--pill); font-size:13.5px; font-weight:600; opacity:0; transition:opacity .3s var(--ease), transform .3s var(--ease); z-index:100; pointer-events:none; box-shadow:var(--shadow)}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
.genopts label{display:flex; align-items:center; gap:9px; font-size:13.5px; margin-bottom:9px}
.hint{font-size:11.5px; color:var(--sub); margin-top:6px; line-height:1.55}
.brand-text{display:inline}

@media (max-width:1024px){
  #sidebar{width:76px; align-items:center}
  .navitem{justify-content:center; padding:12px}
  .nav-lb{display:none}
}
@media (min-width:1025px){
  #main{max-width:880px; margin:0 auto; width:100%}
}
@media (max-width:680px){
  #layout{flex-direction:column}
  #sidebar{
    position:fixed; bottom:0; left:0; right:0; width:100%; flex-direction:row; justify-content:space-around;
    padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px)); background:color-mix(in oklch, var(--bg) 92%, transparent);
    backdrop-filter:blur(16px); border-top:1px solid var(--border); z-index:15;
  }
  .navitem{flex-direction:column; gap:2px; padding:6px 8px; flex:1}
  .nav-lb{display:block; font-size:10.5px}
  #sidebarToggle{display:none!important}
  #main{padding:14px 16px 90px}
  .overlay{align-items:flex-end; padding:0}
  .modal{max-width:none; border-radius:22px 22px 0 0; margin-bottom:0; padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
  @keyframes modalpop{from{opacity:0; transform:translateY(30px)} to{opacity:1; transform:none}}
}
@media (max-width:420px){
  .brand-text{display:none}
}
</style>
</head>
<body>

<div id="lock">
  <div class="card">
    <div class="logo">🔐</div>
    <h1 id="lockTitle">VaultKey</h1>
    <p id="lockSub">マスターパスワードでロック解除</p>
    <input type="password" id="pw1" placeholder="マスターパスワード" autocomplete="off">
    <input type="password" id="pw2" placeholder="確認のため再入力" style="display:none" autocomplete="off">
    <div id="lockErr"></div>
    <button class="btn btn-primary" id="lockBtn" style="width:100%">解除</button>
  </div>
</div>

<div id="app">
  <div id="topbar">
    <button class="btn-icon" id="sidebarToggle" style="display:none">☰</button>
    <div class="brand">🔐<span class="brand-text"> VaultKey</span></div>
    <div class="spacer"></div>
    <button class="btn-icon" id="themeBtn" title="テーマ切替">🌓</button>
    <button class="btn-icon" id="settingsBtn" title="設定">⚙️</button>
    <button class="btn btn-primary" id="addBtn">＋ 追加</button>
    <button class="btn-icon" id="lockNowBtn" title="今すぐロック">🔒</button>
  </div>
  <div id="layout">
    <div id="sidebar">
      <button class="navitem active" data-view="all"><span class="nav-ic">🏠</span> <span class="nav-lb">すべて</span></button>
      <button class="navitem" data-view="fav"><span class="nav-ic">⭐</span> <span class="nav-lb">お気に入り</span></button>
      <button class="navitem" data-view="totp"><span class="nav-ic">⏱</span> <span class="nav-lb">TOTP</span></button>
      <button class="navitem" data-view="trash"><span class="nav-ic">🗑</span> <span class="nav-lb">ゴミ箱</span></button>
    </div>
    <div id="main">
      <div id="searchbar">
        <input id="search" placeholder="🔍 検索">
        <div id="tagChips"></div>
      </div>
      <div id="listMeta">
        <strong id="viewTitle">すべて</strong>
        <span class="spacer"></span>
        <select id="sortSel">
          <option value="updated">更新順</option>
          <option value="created">作成順</option>
          <option value="title">名前順</option>
          <option value="fav">お気に入り優先</option>
        </select>
      </div>
      <div id="grid"></div>
      <div id="empty" style="display:none">項目がありません。「＋ 追加」から登録しましょう。</div>
    </div>
  </div>
</div>

<!-- Entry edit modal -->
<div class="overlay" id="entryOverlay">
  <div class="modal card">
    <h2 id="entryModalTitle">新規項目</h2>
    <div class="field"><label>タイトル *</label><input id="fTitle" placeholder="例: Google アカウント"></div>
    <div class="field"><label>ユーザー名 / メール</label><input id="fUser"></div>
    <div class="field"><label>パスワード</label>
      <div class="pwrow">
        <input id="fPass" type="password">
        <button class="btn-icon btn-ghost" id="togglePw" type="button">👁</button>
        <button class="btn-icon btn-ghost" id="genBtn" type="button" title="生成">🎲</button>
      </div>
      <div class="strength"><div id="strBar"></div></div>
      <div class="hint" id="strLabel"></div>
    </div>
    <div class="field"><label>TOTP シークレット（2段階認証）</label><input id="fTotp" placeholder="Base32 secret または otpauth:// URL" style="font-family:var(--mono)"></div>
    <div class="field"><label>URL</label><input id="fUrl" placeholder="https://"></div>
    <div class="field"><label>タグ（カンマ区切り）</label><input id="fTags" placeholder="仕事, 個人"></div>
    <div class="field"><label>メモ</label><textarea id="fNotes" rows="2"></textarea></div>
    <div class="field" id="histWrap" style="display:none"><label>パスワード履歴</label><div id="histList" style="font-family:var(--mono); font-size:12px; color:var(--sub)"></div></div>
    <div class="modalfoot">
      <button class="btn btn-danger" id="entryDeleteBtn" style="display:none">削除</button>
      <span class="spacer"></span>
      <button class="btn btn-ghost" id="entryCancelBtn">キャンセル</button>
      <button class="btn btn-primary" id="entrySaveBtn">保存</button>
    </div>
  </div>
</div>

<!-- Generator modal -->
<div class="overlay" id="genOverlay">
  <div class="modal card" style="max-width:360px">
    <h2>パスワード生成</h2>
    <div class="field"><input id="genOut" style="font-family:var(--mono); text-align:center; font-size:16px" readonly></div>
    <div class="field"><label>長さ: <span id="genLenVal">16</span></label><input type="range" id="genLen" min="6" max="48" value="16"></div>
    <div class="genopts">
      <label><input type="checkbox" id="genUpper" checked> 大文字 (A-Z)</label>
      <label><input type="checkbox" id="genLower" checked> 小文字 (a-z)</label>
      <label><input type="checkbox" id="genDigits" checked> 数字 (0-9)</label>
      <label><input type="checkbox" id="genSymbols" checked> 記号 (!@#$...)</label>
      <label><input type="checkbox" id="genAmbig"> 紛らわしい文字を除外 (l1IO0)</label>
    </div>
    <div class="modalfoot">
      <button class="btn btn-ghost" id="genRefresh">🔄 再生成</button>
      <span class="spacer"></span>
      <button class="btn btn-ghost" id="genCloseBtn">閉じる</button>
      <button class="btn btn-primary" id="genUseBtn">この値を使う</button>
    </div>
  </div>
</div>

<!-- Settings modal -->
<div class="overlay" id="settingsOverlay">
  <div class="modal card">
    <h2>設定</h2>
    <div class="field"><label>自動ロック（分の操作なしで）</label>
      <select id="autoLockSel">
        <option value="1">1分</option><option value="5">5分</option><option value="15">15分</option><option value="60">60分</option><option value="0">しない</option>
      </select>
    </div>
    <div class="field"><label>マスターパスワード変更</label>
      <input type="password" id="curPw" placeholder="現在のパスワード" style="margin-bottom:6px">
      <input type="password" id="newPw" placeholder="新しいパスワード" style="margin-bottom:6px">
      <button class="btn btn-ghost" id="changePwBtn">変更する</button>
      <div class="hint" id="changePwMsg"></div>
    </div>
    <div class="field"><label>バックアップ（暗号化されたまま書き出し / 読み込み）</label>
      <div style="display:flex; gap:8px">
        <button class="btn btn-ghost" id="exportBtn">⬇ エクスポート</button>
        <button class="btn btn-ghost" id="importBtn">⬆ インポート</button>
      </div>
      <input type="file" id="importFile" accept=".json" style="display:none">
    </div>
    <div class="field"><label>クラウド同期（Cloudflare Worker + R2、任意）</label>
      <input id="syncUrl" placeholder="https://your-worker.xxx.workers.dev" style="margin-bottom:6px">
      <input type="password" id="syncToken" placeholder="トークン" style="margin-bottom:6px">
      <div style="display:flex; gap:8px">
        <button class="btn btn-ghost" id="syncUploadBtn">⬆ アップロード</button>
        <button class="btn btn-ghost" id="syncDownloadBtn">⬇ ダウンロード</button>
      </div>
      <div class="hint" id="syncMsg"></div>
    </div>
    <div class="hint">全データはマスターパスワードから導出した鍵でAES-GCM暗号化した上でこの端末に保存されます。クラウド同期を設定しない限り外部には送信されません。同期設定時も、送信されるのは暗号文のみで、鍵（マスターパスワード）は一切送信されません。個人利用向けの簡易ツールです。定期的なバックアップを推奨します。</div>
    <div class="modalfoot"><span class="spacer"></span><button class="btn btn-primary" id="settingsCloseBtn">閉じる</button></div>
  </div>
</div>

<!-- Import password prompt -->
<div class="overlay" id="importPwOverlay">
  <div class="modal card" style="max-width:360px">
    <h2>インポート用パスワード</h2>
    <p class="hint">読み込むバックアップファイルを暗号化した際のマスターパスワードを入力してください。</p>
    <input type="password" id="importPw" placeholder="パスワード" style="margin-bottom:10px">
    <div id="importErr" class="hint" style="color:var(--danger)"></div>
    <div class="modalfoot"><span class="spacer"></span><button class="btn btn-ghost" id="importPwCancel">キャンセル</button><button class="btn btn-primary" id="importPwOk">読み込む</button></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
const b64=b=>btoa(String.fromCharCode(...b)), ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));

/* ---------- crypto ---------- */
async function deriveKey(pw,saltBytes,iter){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:saltBytes,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function encObj(key,obj){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(obj)));
  return {iv:b64(iv),ct:b64(new Uint8Array(ct))};
}
async function decObj(key,ivB64,ctB64){
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(ivB64)},key,ub64(ctB64));
  return JSON.parse(new TextDecoder().decode(pt));
}
/* ---------- TOTP ---------- */
const B32A="ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
function parseSecret(raw){
  raw=raw.trim();
  if(raw.startsWith('otpauth://')){ try{ const u=new URL(raw); return (u.searchParams.get('secret')||'').replace(/\s/g,''); }catch(e){ return raw; } }
  return raw.replace(/\s/g,'');
}
function b32decode(str){
  str=str.toUpperCase().replace(/=+$/,'').replace(/[^A-Z2-7]/g,'');
  let bits='',bytes=[];
  for(const c of str){ const v=B32A.indexOf(c); if(v<0)continue; bits+=v.toString(2).padStart(5,'0'); }
  for(let i=0;i+8<=bits.length;i+=8) bytes.push(parseInt(bits.substr(i,8),2));
  return new Uint8Array(bytes);
}
async function totpCode(secretRaw,period=30,digits=6,t=Date.now()){
  const key=b32decode(parseSecret(secretRaw));
  if(!key.length) return null;
  const counter=Math.floor(t/1000/period);
  const buf=new ArrayBuffer(8), v=new DataView(buf);
  v.setUint32(0,Math.floor(counter/0x100000000)); v.setUint32(4,counter>>>0);
  const ck=await crypto.subtle.importKey('raw',key,{name:'HMAC',hash:'SHA-1'},false,['sign']);
  const sig=new Uint8Array(await crypto.subtle.sign('HMAC',ck,new Uint8Array(buf)));
  const off=sig[sig.length-1]&0xf;
  const bin=((sig[off]&0x7f)<<24)|((sig[off+1]&0xff)<<16)|((sig[off+2]&0xff)<<8)|(sig[off+3]&0xff);
  return (bin%(10**digits)).toString().padStart(digits,'0');
}

$('#lockBtn').onclick=async ()=>{
  const p1=$('#pw1').value, p2=$('#pw2').value, err=$('#lockErr'); err.textContent='';
  const m=getMeta();
  $('#lockBtn').classList.add('loading'); $('#lockBtn').disabled=true;
  try{
    if(!m){
      if(p1.length<6){ err.textContent='6文字以上にしてください'; return; }
      if(p1!==p2){ err.textContent='パスワードが一致しません'; return; }
      const salt=crypto.getRandomValues(new Uint8Array(16));
      key=await deriveKey(p1,salt,250000);
      vault={entries:[],settings:{autoLock:5}};
      const {iv,ct}=await encObj(key,vault);
      localStorage.setItem(META,JSON.stringify({salt:b64(salt),iter:250000,iv,ct}));
      enterApp();
    } else {
      const salt=ub64(m.salt);
      key=await deriveKey(p1,salt,m.iter);
      vault=await decObj(key,m.iv,m.ct);
      if(!vault.settings) vault.settings={autoLock:5};
      enterApp();
    }
  }catch(e){ err.textContent='パスワードが違います'; key=null; }

};

function pwStrengthScore(pw){
  if(!pw) return 0;
  let pool=0; if(/[a-z]/.test(pw))pool+=26; if(/[A-Z]/.test(pw))pool+=26; if(/[0-9]/.test(pw))pool+=10; if(/[^A-Za-z0-9]/.test(pw))pool+=32;
  const bits=pw.length*Math.log2(pool||2);
  if(pw.length<8) return 1;
  if(bits<40) return 2; if(bits<60) return 3; if(bits<80) return 4; return 5;
}
function visibleEntries(){
  const q=$('#search').value.trim().toLowerCase();
  let list=vault.entries.filter(e=>{
    if(activeView==='trash') return !!e.deleted;
    if(e.deleted) return false;
    if(activeView==='fav' && !e.favorite) return false;
    if(activeView==='totp' && !e.totp) return false;
    if(activeTag && !(e.tags||[]).includes(activeTag)) return false;
    if(q){ const hay=[e.title,e.username,e.url,e.notes].join(' ').toLowerCase(); if(!hay.includes(q)) return false; }
    return true;
  });
  const sort=$('#sortSel').value;
  list.sort((a,b)=>{
    if(sort==='title') return (a.title||'').localeCompare(b.title||'');
    if(sort==='created') return (b.created||0)-(a.created||0);
    if(sort==='fav') return (b.favorite?1:0)-(a.favorite?1:0) || (b.updated||0)-(a.updated||0);
    return (b.updated||0)-(a.updated||0);
  });
  return list;
}
function pwCounts(){
  const m={}; vault.entries.forEach(e=>{ if(!e.deleted && e.password){ m[e.password]=(m[e.password]||0)+1; } }); return m;
}
function faviconUrl(url){
  if(!url) return '';
  try{
    let u=url.trim(); if(!u) return '';
    if(!/^https?:\/\//i.test(u)) u='https://'+u;
    const host=new URL(u).hostname;
    return `https://www.google.com/s2/favicons?sz=64&domain=${encodeURIComponent(host)}`;
  }catch(e){ return ''; }
}
function render(){
  renderTagChips();
  const list=visibleEntries(), grid=$('#grid'), dup=pwCounts();
  grid.innerHTML=''; $('#empty').style.display = list.length? 'none':'block';
  list.forEach(e=>{
    const card=document.createElement('div'); card.className='entry card'; card.dataset.id=e.id;
    const strong=pwStrengthScore(e.password);
    let badges='';
    if(e.password && strong<=2) badges+='<span class="badge weak">弱い</span>';
    if(e.password && dup[e.password]>1) badges+='<span class="badge dup">重複</span>';
    const initial=esc((e.title||'?').trim().charAt(0).toUpperCase()||'?');
    const fav=faviconUrl(e.url);
    card.innerHTML = `
      <div class="avatar">${initial}${fav?`<img class="favicon" src="${fav}" alt="" onerror="this.remove()">`:''}</div>
      <div class="entrymain">
        <div class="title">${esc(e.title||'(無題)')}</div>
        <div class="user">${esc(e.username||'')}</div>
        <div class="meta-row">${badges}${e.tags&&e.tags.length?e.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join(''):''}</div>
      </div>
      <div class="entryside">
        ${e.totp?`<div class="totpmini"><span class="ring" data-ring="${e.id}"></span><span class="tcode" data-id="${e.id}">------</span><span class="tsec" data-sec="${e.id}"></span></div>`:''}
        <span class="fav ${e.favorite?'on':''}" data-act="fav">★</span>
      </div>
    `;
    card.querySelector('[data-act="fav"]').onclick=(ev)=>{ ev.stopPropagation(); e.favorite=!e.favorite; e.updated=Date.now(); persist(); render(); };
    card.onclick=()=>{ if(e.deleted) openTrashItem(e.id); else openEntry(e.id); };
    grid.appendChild(card);
  });
  renderTotpTicks();
}
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
async function renderTotpTicks(){
  const nodes=$$('.tcode'); if(!nodes.length) return;
  const now=Date.now();
  const period=30;
  const remain=period-(Math.floor(now/1000)%period);
  const pct=(remain/period)*100;
  for(const n of nodes){
    const e=vault.entries.find(x=>x.id===n.dataset.id); if(!e||!e.totp) continue;
    try{
      n.textContent=(await totpCode(e.totp,30,6,now)).replace(/(\d{3})(\d{3})/,'$1 $2');
      const ring=document.querySelector(`[data-ring="${e.id}"]`);
      const sec=document.querySelector(`[data-sec="${e.id}"]`);
      if(ring){ ring.style.setProperty('--pct',pct.toFixed(1)); ring.classList.toggle('low',remain<=5); ring.title=remain+'秒後に更新'; }
      if(sec) sec.textContent=remain+'s';
    }
    catch(err){ n.textContent='------'; }
  }
}

function doGen(){
  const len=+$('#genLen').value;
  let up='ABCDEFGHJKLMNPQRSTUVWXYZ', lo='abcdefghijkmnopqrstuvwxyz', di='23456789', sy='!@#$%^&*-_=+?';
  if(!$('#genAmbig').checked){ up='ABCDEFGHIJKLMNOPQRSTUVWXYZ'; lo='abcdefghijklmnopqrstuvwxyz'; di='0123456789'; }
  const sets=[]; if($('#genUpper').checked)sets.push(up); if($('#genLower').checked)sets.push(lo); if($('#genDigits').checked)sets.push(di); if($('#genSymbols').checked)sets.push(sy);
  if(!sets.length){ $('#genOut').value='(種類を1つ以上選択)'; return; }
  const all=sets.join('');
  const rnd=n=>{ const a=new Uint32Array(1); crypto.getRandomValues(a); return a[0]%n; };
  let pw=sets.map(s=>s[rnd(s.length)]);
  while(pw.length<len) pw.push(all[rnd(all.length)]);
  for(let i=pw.length-1;i>0;i--){ const j=rnd(i+1); [pw[i],pw[j]]=[pw[j],pw[i]]; }
  $('#genOut').value=pw.slice(0,len).join('');
}

let pendingImport=null;
$('#importFile').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{ pendingImport=JSON.parse(r.result); importIntent='import'; $('#importPw').value=''; $('#importErr').textContent=''; $('#importPwOverlay').classList.add('show'); }catch(err){ toast('ファイルを読み込めませんでした'); } };
  r.readAsText(f); e.target.value='';
});
$('#importPwCancel').onclick=()=>$('#importPwOverlay').classList.remove('show');
$('#importPwOk').onclick=async ()=>{
  const pw=$('#importPw').value, err=$('#importErr');
  try{
    const k=await deriveKey(pw,ub64(pendingImport.salt),pendingImport.iter);
    const data=await decObj(k,pendingImport.iv,pendingImport.ct);
    let added=0,updated=0;
    (data.entries||[]).forEach(im=>{
      const ex=vault.entries.find(x=>x.id===im.id);
      if(!ex){ vault.entries.push(im); added++; }
      else if((im.updated||0)>(ex.updated||0)){ Object.assign(ex,im); updated++; }
    });
    persist(); render();
    if(importIntent==='upload'){
      const s=syncEndpoint();
      if(s){
        const m=getMeta();
        const put=await fetch(s.url.replace(/\/$/,'')+'/vault',{method:'PUT',headers:{'Authorization':'Bearer '+s.token,'Content-Type':'application/json'},body:JSON.stringify(m)});
        if(!put.ok) throw new Error(put.status);
      }
      $('#importPwOverlay').classList.remove('show'); $('#settingsOverlay').classList.remove('show');
      toast(`マージしてアップロードしました（追加${added}件・更新${updated}件）`);
    } else {
      $('#importPwOverlay').classList.remove('show'); $('#settingsOverlay').classList.remove('show');
      toast(`インポート完了（追加${added}件・更新${updated}件）`);
    }
  }catch(e){ err.textContent = importIntent==='upload' ? 'パスワードが違うか、アップロードに失敗しました' : 'パスワードが違うか、ファイルが壊れています'; }
};
})();
</script>
